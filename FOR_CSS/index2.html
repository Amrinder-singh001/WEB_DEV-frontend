<!-- All about inline styling in an html file through style tag inside the head tag --> -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline styling</title>
    <style>
      h1{
        color: red;
        background-color: aquamarine;
      }

      p{
        color: aqua;
        background-color: white;
      }

      button{
        color: aquamarine;
        background-color: darkred;
      }

    </style>
</head>
<body>
    <h1> All about css in html </h1>
    <h1> Apna collage </h1>
    <p> This is a paragraph</p>
    <button> Help me</button>
</body>
</html>
